<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c13"><title>弦生 · 琵琶声音实验</title><link rel="stylesheet" href="particles.css?v=5"></head><body>
<canvas id="stage" aria-label="琵琶声音驱动的粒子舞台"></canvas>
<header><a href="particles.html" class="brand">弦生<span>STRING / FORM</span></a><span class="edition">六种声音形态 · 对比实验</span><button id="immersive" aria-pressed="false">沉浸模式</button><button id="burst">触发强奏 ✦</button><button id="fullscreen">全屏 ↗</button></header>
<main><div class="intro"><span class="eyebrow">让余音，有迹可循。</span><h1>呼吸<br>粒子云。</h1><p>一团光尘随声音聚散。<br>听见轻拨，看见呼吸。</p></div><div id="show-progress"><span id="chapter">六种形态 · 等待启幕</span><i><b id="chapter-progress"></b></i></div><div id="hint">移动指针改变视角 · 点击舞台触发爆发</div></main>
<aside class="readout"><span id="mode">就绪 / 点击播放演示</span><div><b id="energy">00</b><span>声音能量</span></div><div class="meter"><i id="meter"></i></div><p id="status" role="status">不需要琵琶。点击演示，或让六种形态自动巡演。</p></aside>
<footer><div class="actions"><button id="tour">六种方案巡演</button><button id="demo" class="primary">▶ 播放当前方案</button><button id="mic">打开麦克风</button><button id="stop" disabled>停止</button></div><div class="styles" role="group" aria-label="六种视觉方案"><button data-style="cloud" aria-pressed="true">① 呼吸粒子云</button><button data-style="ribbon" aria-pressed="false">② 丝带流场</button><button data-style="water" aria-pressed="false">③ 粒子水面</button><button data-style="ring" aria-pressed="false">④ 声纹光环</button><button data-style="sand" aria-pressed="false">⑤ 共振沙场</button><button data-style="galaxy" aria-pressed="false">⑥ 星河风暴</button></div><label class="tension">视觉张力 <input id="tension" type="range" min="0.6" max="1.8" step="0.1" value="1.2"></label><button id="capture">保存画面 ↓</button><label class="upload">导入音频<input id="file" type="file" accept="audio/*"></label><span class="note">巡演每个场景 18 秒 · 合成拨弦音色，非真实琵琶录音</span></footer>
