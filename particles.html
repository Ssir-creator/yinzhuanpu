<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c13"><title>弦生 · 琵琶声音实验</title><link rel="stylesheet" href="particles.css?v=4"></head><body>

<main><div class="intro"><span class="eyebrow">让余音，有迹可循。</span><h1>星河<br>风暴。</h1><p>置身旋转星系，让每次拨弦<br>掀起一场向外蔓延的风暴。</p></div><div id="show-progress"><span id="chapter">星河风暴 · 等待启幕</span><i><b id="chapter-progress"></b></i></div><div id="hint">移动指针改变视角 · 点击舞台触发爆发</div></main>

<footer><div class="actions"><button id="tour">五种方案巡演</button><button id="demo" class="primary">▶ 观看星河风暴</button><button id="mic">打开麦克风</button><button id="stop" disabled>停止</button></div><div class="styles" role="group" aria-label="五种视觉方案"><button data-style="galaxy" aria-pressed="true">① 星河风暴</button><button data-style="mountains" aria-pressed="false">② 万仞山海</button><button data-style="dragon" aria-pressed="false">③ 游龙入海</button><button data-style="aurora" aria-pressed="false">④ 天幕极光</button><button data-style="rift" aria-pressed="false">⑤ 弦裂天地</button></div><label class="tension">视觉张力 <input id="tension" type="range" min="0.6" max="1.8" step="0.1" value="1.2"></label><button id="capture">保存画面 ↓</button><label class="upload">导入音频<input id="file" type="file" accept="audio/*"></label><span class="note">巡演每个场景 18 秒 · 合成拨弦音色，非真实琵琶录音</span></footer>
