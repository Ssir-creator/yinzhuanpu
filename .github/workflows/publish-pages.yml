name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-website
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone website
        run: python3 scripts/build_standalone.py
      - name: Update public branch
        run: python3 scripts/publish_pages.py
      # GITHUB_TOKEN pushes do not trigger another workflow automatically.
      # Explicitly request the legacy Pages build for the configured gh-pages source.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status,url}'
